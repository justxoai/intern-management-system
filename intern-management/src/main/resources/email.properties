# Email configuration for Internship Management System
# Configure your SMTP credentials here.
# Leave mail.username and mail.password empty to disable email sending (graceful degradation).

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true

# Sender display name + address
mail.from.name=Internship Management System
mail.from.address=noreply@internship.vn

# SMTP credentials (use Gmail App Password if 2FA is enabled)
mail.username=
mail.password=
